[project]
name = "agents-sdk-lab"
version = "0.1.0"
description = "A hands-on lab for the OpenAI Agents SDK, runnable fully offline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai-agents>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
agents-lab = "agents_lab.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_lab"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
